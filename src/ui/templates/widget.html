<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Tenant Chat Widget</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; }
    #chatbox { border: 1px solid #ccc; width: 100%; height: 500px; overflow-y: auto; padding: 10px; }
    #input { width: 80%; }
    #send { width: 18%; }
    .user { color: blue; margin: 5px 0; }
    .agent { color: green; margin: 5px 0; }
  </style>
</head>
<body>
  <div id="chatbox"></div>
  <input id="input" type="text" placeholder="Type a message..."/>
  <button id="send">Send</button>
  <!-- ✅ Load tenant‑aware JS -->
  <script src="/static/widget.js"></script>
</body>
</html>
