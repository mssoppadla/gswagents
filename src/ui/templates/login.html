<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ZenAI SaaS Login</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin-top: 100px; }
    .login-box { display: inline-block; padding: 40px; border: 1px solid #ccc; border-radius: 8px; }
    .google-btn {
      display: inline-block;
      background: #4285F4;
      color: white;
      padding: 12px 24px;
      border-radius: 4px;
      text-decoration: none;
      font-weight: bold;
    }
    .google-btn:hover { background: #357ae8; }
  </style>
</head>
<body>
  <div class="login-box">
    <h1>Welcome to ZenAI</h1>
    <p>Sign in to manage your tenant and knowledge base</p>
    <a class="google-btn" href="/auth/google/login">Sign in with Google</a>
  </div>
</body>
</html>
